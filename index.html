<style>
/* Elzarandawy Islamic Academy — design system (no framework, RTL-aware) */
:root{
  --g950:#03221a; --g900:#06382a; --g800:#0a4d39; --g700:#0e6a4d; --g600:#12865f; --g100:#dff1e9; --g50:#f0f8f4;
  --gold:#b98a2c; --gold2:#d9b04e; --gold3:#f1deA0; --cream:#fbf7ec; --cream2:#f4edda;
  --ink:#16231f; --ink2:#41524c; --ink3:#6c7d77; --line:#e3e8e5; --bg:#f6f8f7; --white:#fff;
  --red:#b3261e; --red-bg:#fdecea; --amber:#a15c00; --amber-bg:#fff4dc; --blue:#1d5fa8; --blue-bg:#e6f0fb;
  --radius:14px; --shadow:0 1px 2px rgba(6,56,42,.06),0 8px 24px rgba(6,56,42,.08); --shadow-lg:0 20px 50px rgba(3,34,26,.22);
  --serif:'Cormorant Garamond','Amiri',Georgia,'Times New Roman',serif; --sans:'Inter','Cairo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --ar:'Cairo','Amiri',system-ui,sans-serif;
}
*{box-sizing:border-box} html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.55;font-size:15px;min-height:100vh;display:flex;flex-direction:column}
html[lang=ar] body{font-family:var(--ar)} html[dir=rtl] .flip{transform:scaleX(-1)}
img{max-width:100%;display:block} a{color:var(--g700);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;color:var(--g900)} h1{font-size:clamp(1.9rem,4.6vw,3.1rem);font-family:var(--serif);font-weight:700} h2{font-size:clamp(1.5rem,3vw,2.1rem);font-family:var(--serif);font-weight:700} h3{font-size:1.1rem}
p{margin:0 0 1em} .muted{color:var(--ink3)} .sm{font-size:.86rem} .xs{font-size:.75rem} .bold{font-weight:700} .center{text-align:center} .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.hidden{display:none!important} .grow{flex:1} .nowrap{white-space:nowrap}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 18px} .narrow{max-width:760px} .section{padding:56px 0}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap} .between{justify-content:space-between} .stack>*+*{margin-top:14px} .gap-s{gap:6px} .gap-l{gap:22px}
.grid{display:grid;gap:22px} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}} @media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
svg.ic{width:1em;height:1em;fill:currentColor;vertical-align:-.125em;flex:none}

/* header */
.announce{background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));color:#2a1d00;font-weight:600;font-size:.84rem;text-align:center;padding:7px 14px}
.site-header{position:sticky;top:0;z-index:40;background:rgba(6,56,42,.97);backdrop-filter:blur(8px);color:#fff;border-bottom:1px solid rgba(217,176,78,.35)}
.site-header .bar{display:flex;align-items:center;gap:18px;height:72px}
.brand{display:flex;align-items:center;gap:11px;color:#fff;cursor:pointer;text-decoration:none!important} .brand img{height:52px;width:52px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
.brand b{display:block;font-family:var(--serif);font-size:1.25rem;line-height:1.05;color:var(--gold3)} .brand small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#a8d4c3}
.nav{display:flex;gap:4px;margin-inline-start:14px} .nav a{color:#d6ebe2;padding:8px 11px;border-radius:9px;font-size:.88rem;font-weight:500;text-decoration:none;display:flex;gap:6px;align-items:center}
.nav a:hover,.nav a.active{background:rgba(255,255,255,.1);color:#fff} .header-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.menu-btn{display:none;background:none;border:0;color:#fff;font-size:1.5rem;padding:6px;cursor:pointer}
.mobile-nav{display:none;background:var(--g950);padding:8px 18px 16px;border-top:1px solid rgba(255,255,255,.08)} .mobile-nav a{display:block;color:#d6ebe2;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
@media(max-width:980px){.nav,.header-actions .hide-m{display:none}.menu-btn{display:block}.mobile-nav.open{display:block}}
.lang-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--gold3);border-radius:9px;padding:7px 10px;font-size:.78rem;font-weight:600;cursor:pointer}

/* Turns a pasted link (YouTube, Google Drive, Facebook, Vimeo, direct mp3/mp4) into a safe embed */
(function () {
  function embed(url, { audio = false } = {}) {
    if (!url) return null;
    let u; try { u = new URL(url); } catch (_) { return null; }
    const h = u.hostname.replace(/^www\.|^m\./, '');
    const p = u.pathname;
    let m;
    if (h === 'youtu.be') return { kind: 'iframe', src: `https://www.youtube-nocookie.com/embed/${encodeURIComponent(p.slice(1))}?rel=0`, provider: 'YouTube' };
    if (h.endsWith('youtube.com') || h.endsWith('youtube-nocookie.com')) {
      const id = u.searchParams.get('v') || (m = /^\/(embed|shorts|live|v)\/([\w-]+)/.exec(p)) && m[2];
      if (id) return { kind: 'iframe', src: `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0`, provider: 'YouTube' };
    }
    if (h === 'drive.google.com' || h === 'docs.google.com') {
      const id = (m = /\/d\/([\w-]+)/.exec(p)) ? m[1] : u.searchParams.get('id');
      if (id) return { kind: 'iframe', src: `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`, provider: 'Google Drive', audio };
    }
    if (h.endsWith('facebook.com') || h === 'fb.watch' || h === 'fb.com') {
      return { kind: 'iframe', src: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&width=734&t=0`, provider: 'Facebook', external: url };
    }
    if (h === 'vimeo.com' && (m = /^\/(\d+)/.exec(p))) return { kind: 'iframe', src: `https://player.vimeo.com/video/${m[1]}`, provider: 'Vimeo' };
    if (/\.(mp4|webm|ogv|mov|m4v)$/i.test(p)) return { kind: 'video', src: url };
    if (/\.(mp3|m4a|wav|ogg|aac|oga)$/i.test(p)) return { kind: 'audio', src: url };
    return { kind: 'link', src: url };
  }
  function player(url, opts = {}) {
    const e = embed(url, opts);
    if (!e) return raw('');
    const cls = opts.audio || e.kind === 'audio' || e.audio ? 'player audio' : 'player';
    let body;
    if (e.kind === 'iframe') body = html`<iframe src="${e.src}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    else if (e.kind === 'video') body = html`<video src="${e.src}" controls controlsList="nodownload" preload="metadata"></video>`;
    else if (e.kind === 'audio') body = html`<div style="display:grid;place-items:center;height:100%;padding:20px"><audio src="${e.src}" controls style="width:100%"></audio></div>`;
    else body = html`<div style="display:grid;place-items:center;height:100%"><a class="btn btn-gold" href="${e.src}" target="_blank" rel="noopener">Open lesson link ${icon('arrow-right')}</a></div>`;
    const ext = e.external || (e.kind === 'iframe' ? opts.original : null);
    return html`<div class="${cls}">${body}</div>${e.external ? html`<div class="xs muted" style="margin-top:6px">If the video does not play, <a href="${e.external}" target="_blank" rel="noopener">open it on ${e.provider}</a>.</div>` : ''}`;
  }
  window.Media = { embed, player };
})();

  route('/learn/:id', async ({ id }, q) => {

  function examTaking(a) {
    const offset = Date.parse(a.serverNow) - Date.now(); const end = Date.parse(a.deadline);
    const answers = { ...a.answers };
    const qHtml = a.questions.map((q, i) => html`<div class="card q-card"><div class="xs muted">Question ${i + 1} of ${a.questions.length} · ${q.points} pt${q.points === 1 ? '' : 's'}</div><h3>${q.text}</h3>${q.options.map((o, k) => html`<label class="opt ${answers[q.id] === k ? 'sel' : ''}"><input type="radio" name="q${q.id}" value="${k}" data-input="answer" data-q="${q.id}" ${answers[q.id] === k ? 'checked' : ''}> <span>${o}</span></label>`)}</div>`);
    let dirty = false, saveT = null, submitting = false;
    const save = async () => { if (!dirty) return; dirty = false; try { await api.put(`/api/attempts/${a.id}/answers`, { answers }); } catch (e) { dirty = true; } };
    App.ons.answer = (el) => {
      answers[el.dataset.q] = Number(el.value); dirty = true; clearTimeout(saveT); saveT = setTimeout(save, 600);
      el.closest('.q-card').querySelectorAll('.opt').forEach((o) => o.classList.toggle('sel', o.contains(el)));
      document.getElementById('answered').textContent = Object.keys(answers).length;
    };
    const submit = async () => {
      if (submitting) return; submitting = true;
      try { await api.post(`/api/attempts/${a.id}/submit`, { answers }); } catch (e) { fail(e); submitting = false; return; }
      clearInterval(timer); render('keep');
    };
    App.actions['exam-submit'] = async () => {
      const left = a.questions.length - Object.keys(answers).length;
      if (await confirmBox(left ? `You have ${left} unanswered question(s). Submit anyway?` : 'Submit your answers now? You cannot change them afterwards.', { okLabel: 'Submit exam' })) submit();
    };
    return { title: a.exam.title, html: html`<div class="container narrow section" style="padding-top:20px">
      <div class="exam-bar"><div><b>${a.exam.title}</b><div class="xs" style="color:#b9dccd">Answered <span id="answered">${Object.keys(answers).length}</span>/${a.questions.length} · pass mark ${a.exam.passMark}%</div></div><div class="timer" id="timer">--:--</div><button class="btn btn-gold btn-sm" data-act="exam-submit">Submit</button></div>
      ${a.exam.instructions ? html`<div class="alert">${icon('circle-info')} <div>${a.exam.instructions}</div></div>` : ''}${qHtml}
      <button class="btn btn-gold btn-lg btn-block" data-act="exam-submit">${icon('check')} Submit exam</button></div>`,
      mount: () => {
        const tick = () => { const ms = end - (Date.now() + offset); const el = document.getElementById('timer'); if (!el) return; if (ms <= 0) { el.textContent = '00:00'; clearInterval(timer); toast('Time is up — submitting your answers…'); submit(); return; } const s = Math.floor(ms / 1000); el.textContent = `${String(Math.floor(s / 3600)).padStart(2, '0') === '00' ? '' : String(Math.floor(s / 3600)).padStart(2, '0') + ':'}${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; el.classList.toggle('low', s < 60); };
        tick(); timer = setInterval(tick, 1000);
      } };
  }
  function examResult(a) {
    const r = a.result;
    return { title: 'Result', mount: (v) => { if (a.certificate) Cert.fit(v); }, html: html`<div class="container narrow section"><div class="card card-body center"><span class="badge ${a.status === 'EXPIRED' ? 'b-gray' : 'b-blue'}">${a.exam.title}${a.status === 'EXPIRED' ? ' · time expired' : ''}</span>
      <div class="score-ring" style="--p:${r.percent};margin-top:18px"><b>${r.percent}%</b></div>
      <h2 style="margin-bottom:4px">${r.passed ? 'Congratulations — you passed!' : 'You did not reach the pass mark'}</h2><p class="muted">Score ${r.score}/${r.maxScore} · pass mark ${a.exam.passMark}% · submitted ${dateTime(r.submittedAt)}</p>
      ${a.certificate ? html`<div class="alert ok" style="margin:14px 0;text-align:start">${icon('circle-check')} <div><b>Your certificate is ready.</b> Certificate number: <b class="mono">${a.certificate.certNo}</b>. Anyone can verify it on the Verify page.</div></div><div class="row" style="justify-content:center;margin-bottom:10px"><button class="btn btn-gold btn-lg" data-act="cert-print">${icon('download')} Download certificate</button>${Object.keys(Cert.PACK).map((l) => html`<button class="btn btn-ghost" data-act="cert-lang" data-lang="${l}">${l}</button>`)}</div>` : ''}<div class="row" style="justify-content:center"><a class="btn" href="/learn/${a.exam.courseId}">${icon('book-open')} Back to course</a>${!r.passed ? html`<button class="btn btn-gold" data-act="exam-start" data-id="${a.exam.id}" data-title="${a.exam.title}" data-min="${a.exam.durationMinutes}">Retake exam</button>` : ''}</div>
      ${!r.passed ? html`<p class="sm muted" style="margin-top:14px">You need ${a.exam.passMark}% to pass. You can retake the exam as many times as you like.</p>` : ''}</div>${a.certificate ? html`<div id="cert-holder" class="card" style="padding:0;overflow:hidden;margin-top:18px">${Cert.stage(a.certHtml)}</div><p class="xs muted center" style="margin-top:12px">Tip: in the print window choose “Save as PDF”, paper size A4, landscape, and enable “Background graphics”.</p>` : ''}
      ${a.review ? html`<h2 style="margin-top:30px">Answer review</h2>${a.review.map((q, i) => html`<div class="card q-card"><h3>${i + 1}. ${q.text}</h3>${q.options.map((o, k) => html`<div class="opt ${k === q.correct ? 'right' : k === q.yourAnswer ? 'wrong' : ''}">${k === q.correct ? icon('circle-check') : k === q.yourAnswer ? icon('circle-xmark') : ''} <span>${o}</span></div>`)}${q.explanation ? html`<div class="sm muted">${icon('circle-info')} ${q.explanation}</div>` : ''}</div>`)}` : ''}</div>` };
  }
})();

/* App shell: header, footer, auth, language, boot */
(function () {

    if (s.telegram) out.push(['telegram', s.telegram, 'Telegram']);

  function authButtons() {

  }

  async function loadBoot() { App.boot = await api.get('/api/public/bootstrap'); }

    const r = await EZA_AUTH.register(d.email.trim(), d.password, d.fullName.trim(), (d.fullNameAr || '').trim());
    App.user = r.user; shell(); toast('Welcome! Your student number is ' + r.user.regNumber + '. A verification email was sent to ' + r.user.email);
    go('/dashboard');
  };
  App.actions['forgot-pw'] = (el, ev) => { if (ev && ev.preventDefault) ev.preventDefault(); openModal('Reset password', html`<form data-form="forgot"><p class="sm">Enter your email. We will send you a link to choose a new password.</p><label class="field"><span>Email</span><input name="email" type="email" required autocomplete="email"></label><button class="btn btn-block" type="submit">Send reset link</button></form>`); };
  App.forms.forgot = async (f) => { await EZA_AUTH.reset(f.email.value.trim()); closeModal(); toast('If this email is registered, a reset link has been sent. Check your inbox and spam.'); };
  App.actions['change-pw'] = async () => { await EZA_AUTH.reset(App.user.email); toast('A link to change your password was sent to ' + App.user.email); };
  App.actions['resend-verify'] = async (el, ev) => { if (ev && ev.preventDefault) ev.preventDefault(); await EZA_AUTH.resend(); toast('Verification email sent to ' + App.user.email + '. Check spam too.'); };

  (async function start() {
    try { await loadBoot(); } catch (e) { document.getElementById('app').innerHTML = '<div class="loading">The academy is unreachable right now. Please try again shortly.<br><small style="display:block;margin-top:14px;color:#8a3b00;word-break:break-word">Reason: ' + (window.__LASTERR || (e && e.message) || 'unknown') + '</small></div>'; return; }
    await loadMe();
    if (App.boot.settings.logo) document.querySelector('link[rel=icon]').href = App.boot.settings.logo;
    shell();
    render('keep');
    try {
      const ref = new URLSearchParams(window.location.search).get('reference');
      if (ref) {
        history.replaceState({}, '', window.location.pathname + window.location.hash);
        if (App.user) {
          const r = await api.get('/api/payments/paystack/verify?reference=' + encodeURIComponent(ref));
          if (r.status === 'APPROVED') { toast('Payment confirmed — the course is now open!'); go('/learn/' + r.courseId); }
          else if (r.status === 'PENDING') { toast('We are still confirming your payment. Please refresh in a minute.'); go('/dashboard'); }
          else toast('This payment was not completed.', 'err');
        }
      }
    } catch (e) { toast('We could not confirm the payment yet. If you were charged, contact us.', 'err'); }
  })();
})();

</script>
<script>

(function () {
  function fixImg(el) {
    var s = el.getAttribute && el.getAttribute('src'); if (!s || s.charAt(0) !== '/') return;
    if (s.indexOf('/api/qr') === 0) { try { var t = decodeURIComponent((s.split('text=')[1] || '')); el.setAttribute('src', 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(__qr.toSvg(t, { border: 1 }))); } catch (e) {} return; }
    var m = /^\/api\/admin\/(payments|donations)\/(\d+)\/proof/.exec(s);
    if (m) { el.setAttribute('src', 'data:image/gif;base64,R0lGODlhAQABAAAAACw='); EZA_ONLINE.api('GET', s).then(function (r) { if (r.dataUrl) el.setAttribute('src', r.dataUrl); }); }
  }
  function scan(root) { if (root.nodeType !== 1) return; if (root.tagName === 'IMG') fixImg(root); root.querySelectorAll && root.querySelectorAll('img').forEach(fixImg); }
  new MutationObserver(function (ms) { ms.forEach(function (m) { if (m.type === 'attributes') fixImg(m.target); else m.addedNodes.forEach(scan); }); })
    .observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
  function blobOf(dataUrl) { var p = dataUrl.split(','), mime = /:(.*?);/.exec(p[0])[1], bin = atob(p[1]), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]'); if (!a) return; var h = a.getAttribute('href') || '';
    if (h.indexOf('/api/admin/backup/download') === 0) {
      e.preventDefault(); e.stopPropagation();
      EZA_ONLINE.api('GET', '/api/admin/backup/export').then(function (r) {
        var url = URL.createObjectURL(new Blob([r.json], { type: 'application/json' })), l = document.createElement('a');
        l.href = url; l.download = 'academy-backup-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(l); l.click(); l.remove();
      }); return;
    }
    var m = /^\/api\/admin\/(payments|donations)\/(\d+)\/proof/.exec(h);
    if (m) { e.preventDefault(); e.stopPropagation(); var w = window.open('', '_blank'); EZA_ONLINE.api('GET', h).then(function (r) { if (r.dataUrl) { var u = URL.createObjectURL(blobOf(r.dataUrl)); if (w) w.location = u; else window.open(u, '_blank'); } }); }
  }, true);
  window.addEventListener('hashchange', function () { window.dispatchEvent(new Event('popstate')); });
  if (window.__NOAPI) { var showSetup = function () { if (document.getElementById('eza-url')) return;
    document.getElementById('app').innerHTML = '<div style="max-width:520px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif"><h2>Almost ready</h2><p>This website is not connected to its server yet. Paste the <b>Web app URL</b> from Google Apps Script below.</p><input id="eza-url" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%;padding:12px;font-size:16px;border:1px solid #aaa;border-radius:8px"><button id="eza-save" style="margin-top:12px;padding:12px 18px;font-size:16px;background:#0f5132;color:#fff;border:0;border-radius:8px">Save and open</button><p style="color:#666;font-size:13px">This is saved only on this device. To connect everyone, put the link inside the file (ask your developer).</p></div>';
    document.getElementById('eza-save').onclick = function () { var v = document.getElementById('eza-url').value.trim(); if (v) EZA_ONLINE.saveUrl(v); };
  }; showSetup(); setInterval(showSetup, 300); }
})();
